<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujian Online Informatika IX</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 780px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #1e3a8a; font-size: 24px; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .hidden { display: none; }
    .header-quiz { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; }
    .badge { background: #dbeafe; color: #1e40af; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; }
    .stimulus-box { background: #f8fafc; border-left: 4px solid #2563eb; padding: 14px 16px; border-radius: 6px; margin-bottom: 18px; font-size: 14.5px; line-height: 1.6; color: #1e293b; white-space: pre-line; }
    .stimulus-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #2563eb; margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
    .question-text { font-size: 17px; font-weight: 600; line-height: 1.5; margin-bottom: 18px; white-space: pre-line; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-item { display: flex; align-items: flex-start; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: 0.15s; line-height: 1.4; }
    .option-item:hover { border-color: #93c5fd; background: #f8fafc; }
    .option-item.selected { border-color: #2563eb; background: #eff6ff; font-weight: 600; }
    .option-item input { margin-right: 12px; margin-top: 3px; transform: scale(1.2); }
    .nav-buttons { display: flex; justify-content: space-between; margin-top: 28px; padding-top: 16px; border-top: 1px solid #e2e8f0; }
    .result-box { text-align: center; padding: 20px 0; }
    .score-circle { width: 120px; height: 120px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px auto; font-size: 32px; font-weight: bold; }
    .score-circle span { font-size: 12px; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <!-- HALAMAN 1: IDENTITAS SISWA -->
  <div id="start-screen">
    <h1>Ujian Online Informatika IX</h1>
    <p class="subtitle">30 Soal Pilihan Ganda (Acak)</p>

    <div class="form-group">
      <label for="nama">Nama Lengkap Siswa</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap..." required />
    </div>

    <div class="form-group">
      <label for="kelas">Kelas</label>
      <select id="kelas" required>
        <option value="">-- Pilih Kelas --</option>
        <option value="IX A">IX A</option>
        <option value="IX B">IX B</option>
        <option value="IX C">IX C</option>
        <option value="IX D">IX D</option>
        <option value="IX E">IX E</option>
        <option value="IX F">IX F</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mapel">Mata Pelajaran</label>
      <input type="text" id="mapel" value="Informatika" readonly />
    </div>

    <button class="btn" style="width: 100%; margin-top: 10px;" onclick="mulaiUjian()">Mulai Ujian</button>
  </div>

  <!-- HALAMAN 2: PENGERJAAN SOAL SATU PER SATU -->
  <div id="quiz-screen" class="hidden">
    <div class="header-quiz">
      <span id="info-siswa" style="font-weight: 600; color: #475569;"></span>
      <span class="badge" id="progress-text">Soal 1 / 30</span>
    </div>

    <div id="question-container">
      <div id="stimulus-container" class="stimulus-box hidden">
        <span class="stimulus-label">Perhatikan Informasi / Wacana Berikut:</span>
        <div id="stimulus-text"></div>
      </div>
      <div class="question-text" id="question-text"></div>
      <div class="options" id="options-container"></div>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" id="btn-prev" onclick="prevSoal()">← Sebelumnya</button>
      <button class="btn" id="btn-next" onclick="nextSoal()">Selanjutnya →</button>
      <button class="btn btn-success hidden" id="btn-finish" onclick="selesaiUjian()">Selesai & Kirim Jawaban</button>
    </div>
  </div>

  <!-- HALAMAN 3: HASIL UJIAN -->
  <div id="result-screen" class="hidden result-box">
    <h2>Ujian Selesai!</h2>
    <p id="status-kirim" style="color: #2563eb; font-weight: 600;">Mengirim nilai ke Google Spreadsheet...</p>
    <div class="score-circle">
      <div id="final-score">0</div>
      <span>Nilai Akhir</span>
    </div>
    <p id="detail-hasil"></p>
  </div>
</div>

<script>
  // =========================================================================
  // 1. MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI
  // =========================================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5XSCkvFghrwjv6jeb-Rk5QChf8B-Svke7A-KECT25yBLj0rgBhL6WHQly7Z2RKZt8UA/exec";

  // =========================================================================
  // 2. DATA 45 SOAL PILIHAN GANDA (LENGKAP DENGAN STIMULUS PER KELOMPOK)
  // =========================================================================
  const stim1 = "Budi adalah sekretaris kelas 9A. Ia diminta oleh wali kelasnya untuk mengolah daftar nilai ujian Informatika dari 30 siswa menggunakan aplikasi Google Sheets. Data nilai tersimpan pada rentang sel B2:B31. Budi perlu menyajikan data seperti total siswa yang tuntas, nilai tertinggi, nilai terendah, dan rata-rata kelas.";
  const stim2 = "Siti kelompok 3 sedang menyusun laporan kegiatan proyek pengolahan sampah sekolah di Google Docs. Siti telah membuat grafik perkembangan volume sampah harian di Google Sheets dan ingin menyisipkan grafik tersebut ke dalam dokumen Google Docs agar laporannya interaktif.";
  const stim3 = "Representasi jalur transportasi antarkota berbasis Struktur Data Graph:\n• Simpul (Node/Vertex): Jakarta, Bandung, Yogyakarta, Surabaya, Bogor\n• Sisi (Edge) & Bobot Jarak (km):\n  - Jakarta – Bandung: 150 km | Jakarta – Surabaya: 650 km | Jakarta – Bogor: 80 km\n  - Bandung – Yogyakarta: 366 km | Bandung – Surabaya: 400 km | Bandung – Bogor: 200 km\n  - Yogyakarta – Bogor: 460 km | Surabaya – Bogor: 578 km";

  const bankSoal = [
    { id: 1, stimulus: stim1, question: "Rumus Google Sheets yang harus digunakan Budi untuk mengetahui banyaknya siswa yang mengikuti ujian (menghitung jumlah data berupa angka di rentang B2:B31) adalah...", options: [{ key: "A", text: "=SUM(B2:B31)" }, { key: "B", text: "=COUNT(B2:B31)" }, { key: "C", text: "=COUNTA(B2:B31)" }, { key: "D", text: "=AVERAGE(B2:B31)" }], answerKey: "B" },
    { id: 2, stimulus: stim1, question: "Fungsi yang digunakan Budi untuk mencari nilai paling rendah yang diperoleh siswa di kelas 9A adalah...", options: [{ key: "A", text: "=MIN(B2:B31)" }, { key: "B", text: "=MAX(B2:B31)" }, { key: "C", text: "=LOW(B2:B31)" }, { key: "D", text: "=SMALL(B2:B31)" }], answerKey: "A" },
    { id: 3, stimulus: stim1, question: "Untuk menghitung rata-rata nilai kelas 9A, rumus yang tepat dimasukkan pada sel hitung adalah...", options: [{ key: "A", text: "=TOTAL(B2:B31)" }, { key: "B", text: "=MAX(B2:B31)" }, { key: "C", text: "=AVERAGE(B2:B31)" }, { key: "D", text: "=COUNT(B2:B31)" }], answerKey: "C" },
    { id: 4, stimulus: stim1, question: "Jika Budi ingin mencari nilai tertinggi di kelas, ia menggunakan fungsi =MAX(B2:B31). Manakah dari opsi berikut yang mendeskripsikan secara tepat keluaran (output) dari fungsi tersebut?", options: [{ key: "A", text: "Jumlah siswa yang mendapat nilai di atas 80." }, { key: "B", text: "Angka terkecil dalam rentang data B2 sampai B31." }, { key: "C", text: "Angka terbesar dalam rentang data B2 sampai B31." }, { key: "D", text: "Nilai tengah dari rentang data B2 sampai B31." }], answerKey: "C" },
    { id: 5, stimulus: stim1, question: "Hasil pencarian rata-rata nilai kelas 9A dengan =AVERAGE(B2:B31) menunjukkan angka 78,5. Jika nilai salah satu siswa yang semula bernilai 60 diperbaiki menjadi 90, maka...", options: [{ key: "A", text: "Rata-rata kelas akan tetap 78,5." }, { key: "B", text: "Rata-rata kelas akan meningkat." }, { key: "C", text: "Nilai =MAX(B2:B31) pasti ikut berubah." }, { key: "D", text: "Hasil =COUNT(B2:B31) bertambah 1." }], answerKey: "B" },
    { id: 6, question: "Budi memiliki tabel berisi daftar nilai ujian 5 siswa: 80, 75, 90, 65, dan 85 di sel B2 hingga B6. Hasil dari fungsi =AVERAGE(B2:B6) adalah...", options: [{ key: "A", text: "77" }, { key: "B", text: "79" }, { key: "C", text: "80" }, { key: "D", text: "82.5" }], answerKey: "B" },
    { id: 7, question: "Apabila di sel B2:B6 terdapat data angka: 10, 20, 5, 15, 30. Berapakah hasil dari sel yang diisi fungsi =MAX(B2:B6) - MIN(B2:B6)?", options: [{ key: "A", text: "25" }, { key: "B", text: "20" }, { key: "C", text: "15" }, { key: "D", text: "30" }], answerKey: "A" },
    { id: 8, question: "Di dalam rentang B2:B10, terdapat 7 sel berisi angka nilai siswa, 1 sel berisi teks 'Izin', dan 1 sel kosong. Berapakah hasil keluaran dari fungsi =COUNT(B2:B10)?", options: [{ key: "A", text: "9" }, { key: "B", text: "8" }, { key: "C", text: "7" }, { key: "D", text: "0" }], answerKey: "C" },
    { id: 9, stimulus: stim1, question: "Pak Guru meminta Budi menampilkan perbandingan proporsi siswa yang mendapat predikat A, B, dan C dalam bentuk grafik visual. Jenis visualisasi data yang paling tepat dipilih Budi di Google Sheets adalah...", options: [{ key: "A", text: "Line Chart (Grafik Garis)" }, { key: "B", text: "Pie Chart (Grafik Lingkaran)" }, { key: "C", text: "Scatter Plot" }, { key: "D", text: "Area Chart" }], answerKey: "B" },
    { id: 10, stimulus: stim1, question: "Budi ingin menyajikan tren kenaikan rata-rata nilai kelas dari Penilaian Harian 1 hingga Penilaian Harian 4. Budi memilih menggunakan Pie Chart. Apakah pilihan jenis grafik Budi sudah tepat?", options: [{ key: "A", text: "Tepat, karena Pie Chart memperlihatkan persentase total." }, { key: "B", text: "Tidak tepat, lebih sesuai menggunakan Line Chart (Grafik Garis) untuk melihat perubahan/tren dari waktu ke waktu." }, { key: "C", text: "Tepat, karena Pie Chart dapat menampilkan perubahan rentang waktu dengan baik." }, { key: "D", text: "Tidak tepat, seharusnya menggunakan fungsi =COUNT terlebih dahulu." }], answerKey: "B" },
    { id: 11, stimulus: stim2, question: "Fitur utama yang digunakan untuk memasukkan grafik dari Google Sheets ke dalam Google Docs adalah melalui menu...", options: [{ key: "A", text: "Insert > Image > Upload from computer" }, { key: "B", text: "Insert > Chart > From Sheets" }, { key: "C", text: "Format > Paragraph styles" }, { key: "D", text: "Edit > Paste Without Formatting" }], answerKey: "B" },
    { id: 12, stimulus: stim2, question: "Saat menempelkan (paste) grafik dari Google Sheets ke Google Docs, opsi 'Link to spreadsheet' berfungsi untuk...", options: [{ key: "A", text: "Mengunci grafik agar tidak bisa diubah lagi nilainya." }, { key: "B", text: "Menyambungkan grafik di Docs dengan data sumber di Sheets sehingga dapat diperbarui otomatis (Update)." }, { key: "C", text: "Menghapus data di Sheets secara otomatis." }, { key: "D", text: "Mengubah warna latar belakang Google Docs." }], answerKey: "B" },
    { id: 13, stimulus: stim2, question: "Jika data volume sampah di Google Sheets diubah oleh Siti, apa langkah yang harus dilakukan Siti pada grafik di Google Docs agar data terbarunya tampil?", options: [{ key: "A", text: "Menghapus grafik lalu menyisipkannya kembali dari awal." }, { key: "B", text: "Mengklik tombol 'Update' / 'Perbarui' yang muncul di pojok atas grafik di Google Docs." }, { key: "C", text: "Mengubah nama dokumen Google Docs." }, { key: "D", text: "Mengunduh grafik dalam bentuk PDF lalu di-copy." }], answerKey: "B" },
    { id: 14, question: "Opsi pemformatan posisi gambar/grafik di Google Docs yang memungkinkan teks mengalir di sekeliling bingkai grafik dinamakan...", options: [{ key: "A", text: "In line with text" }, { key: "B", text: "Wrap text" }, { key: "C", text: "Break text" }, { key: "D", text: "Behind text" }], answerKey: "B" },
    { id: 15, stimulus: stim2, question: "Jika Siti memilih opsi 'Paste unlinked' saat memasukkan grafik dari Google Sheets ke Google Docs, dampak yang terjadi adalah...", options: [{ key: "A", text: "Grafik di Google Docs akan hilang jika Google Sheets dihapus." }, { key: "B", text: "Grafik di Google Docs tidak akan berubah meskipun data di Google Sheets diperbarui." }, { key: "C", text: "Grafik di Google Docs dapat diedit langsung angkanya tanpa membuka Sheets." }, { key: "D", text: "Dokumen Google Docs tidak bisa disimpan." }], answerKey: "B" },
    { id: 16, question: "Mengapa menyisipkan grafik secara Linked lebih disukai dalam pembuatan laporan berkala dibanding screenshot gambar manual?", options: [{ key: "A", text: "Karena screenshot membutuhkan memori yang jauh lebih besar di Google Drive." }, { key: "B", text: "Karena grafik terhubung menjaga konsistensi data secara real-time tanpa perlu menangkap layar berulang kali saat data berubah." }, { key: "C", text: "Karena screenshot tidak bisa diatur posisinya di Google Docs." }, { key: "D", text: "Karena Google Docs hanya bisa membaca grafik dalam format spreadsheet." }], answerKey: "B" },
    { id: 17, stimulus: stim2, question: "Siti mendapati grafik yang muncul di Google Docs terpotong dan teks di sampingnya berantakan. Solusi paling tepat untuk merapikan tata letak (layout) laporan tersebut adalah...", options: [{ key: "A", text: "Mengubah ukuran gambar dan memilih opsi tata letak Wrap Text atau Break Text serta mengatur margin gambar." }, { key: "B", text: "Menghapus semua teks di dokumen." }, { key: "C", text: "Menghapus grafik dan menggantinya dengan tabel rumus =AVERAGE." }, { key: "D", text: "Mengubah format file menjadi .txt." }], answerKey: "A" },
    { id: 18, question: "Untuk menyusun laporan kelompok secara bersama-sama di Google Docs pada waktu yang sama, fitur yang dimanfaatkan adalah...", options: [{ key: "A", text: "Export to PDF" }, { key: "B", text: "Share / Bagikan (Kolaborasi Real-time)" }, { key: "C", text: "Download as Word (.docx)" }, { key: "D", text: "Page Setup" }], answerKey: "B" },
    { id: 19, stimulus: stim2, question: "Apabila Siti ingin menambahkan keterangan sumber data di bawah grafik dengan ukuran teks lebih kecil, opsi gaya penulisan teks di Google Docs yang sesuai adalah...", options: [{ key: "A", text: "Heading 1" }, { key: "B", text: "Title" }, { key: "C", text: "Caption / Footnote (Catatan Kaki)" }, { key: "D", text: "Subtitle" }], answerKey: "C" },
    { id: 20, question: "Jika kamu diminta menyajikan laporan analisis kebersihan sekolah yang memuat grafik tren sampah mingguan, langkah berurutan yang paling efektif adalah...", options: [{ key: "A", text: "Buat grafik di Docs -> Masukkan rumus di Sheets -> Tulis laporan." }, { key: "B", text: "Olah data nilai/volume dengan rumus (COUNT, AVERAGE) & buat grafik di Sheets -> Link grafik ke Docs -> Tulis narasi analisis di Docs." }, { key: "C", text: "Tulis narasi di Docs -> Buat grafik manual dengan gambar garis -> Hitung rata-rata di kalkulator." }, { key: "D", text: "Kirim email ke guru -> Olah data di Sheets -> Buat tabel di Docs." }], answerKey: "B" },
    { id: 21, stimulus: stim3, question: "Pada struktur data graph peta transportasi di atas, simpul (node/vertex) merepresentasikan...", options: [{ key: "A", text: "Jarak antarkota dalam km" }, { key: "B", text: "Nama kota" }, { key: "C", text: "Waktu tempuh perjalanan" }, { key: "D", text: "Biaya bahan bakar" }], answerKey: "B" },
    { id: 22, stimulus: stim3, question: "Angka (seperti 150, 80, 400) yang tertera pada garis/sisi penghubung antarkota disebut...", options: [{ key: "A", text: "Root (Akar)" }, { key: "B", text: "Weight / Bobot (Jarak dalam km)" }, { key: "C", text: "Leaf (Daun)" }, { key: "D", text: "Degree (Derajat)" }], answerKey: "B" },
    { id: 23, stimulus: stim3, question: "Berdasarkan graph di atas, kota mana yang terhubung langsung dengan Jakarta melalui jalur transportasi?", options: [{ key: "A", text: "Bandung, Surabaya, Bogor" }, { key: "B", text: "Yogyakarta, Surabaya, Bogor" }, { key: "C", text: "Bandung dan Yogyakarta saja" }, { key: "D", text: "Semua kota terhubung langsung ke Jakarta" }], answerKey: "A" },
    { id: 24, stimulus: stim3, question: "Berapakah jarak langsung antarkota dari Jakarta menuju Bogor berdasarkan peta graph tersebut?", options: [{ key: "A", text: "150 km" }, { key: "B", text: "200 km" }, { key: "C", text: "80 km" }, { key: "D", text: "578 km" }], answerKey: "C" },
    { id: 25, stimulus: stim3, question: "Berapakah jumlah total kota (simpul) yang terdapat dalam representasi graph transportasi tersebut?", options: [{ key: "A", text: "4 kota" }, { key: "B", text: "5 kota" }, { key: "C", text: "6 kota" }, { key: "D", text: "8 kota" }], answerKey: "B" },
    { id: 26, stimulus: stim3, question: "Kota mana yang TIDAK memiliki jalur transportasi langsung ke kota Yogyakarta?", options: [{ key: "A", text: "Bandung" }, { key: "B", text: "Bogor" }, { key: "C", text: "Jakarta" }, { key: "D", text: "Bandung dan Bogor" }], answerKey: "C" },
    { id: 27, stimulus: stim3, question: "Seorang pengemudi ingin berjalan dari Jakarta ke Bandung, kemudian dilanjutkan dari Bandung ke Yogyakarta. Berapakah total jarak yang ditempuh pengemudi tersebut?", options: [{ key: "A", text: "516 km" }, { key: "B", text: "550 km" }, { key: "C", text: "616 km" }, { key: "D", text: "480 km" }], answerKey: "A" },
    { id: 28, stimulus: stim3, question: "Jika rute perjalanan adalah Surabaya -> Bandung -> Bogor, total jarak rute tersebut adalah...", options: [{ key: "A", text: "600 km" }, { key: "B", text: "778 km" }, { key: "C", text: "978 km" }, { key: "D", text: "650 km" }], answerKey: "A" },
    { id: 29, stimulus: stim3, question: "Rute perjalanan manakah yang memiliki jarak langsung paling pendek antarkota?", options: [{ key: "A", text: "Jakarta – Bandung (150 km)" }, { key: "B", text: "Jakarta – Bogor (80 km)" }, { key: "C", text: "Bandung – Bogor (200 km)" }, { key: "D", text: "Bandung – Yogyakarta (366 km)" }], answerKey: "B" },
    { id: 30, stimulus: stim3, question: "Rute langsung antarkota mana yang memiliki bobot jarak paling panjang/terjauh?", options: [{ key: "A", text: "Surabaya – Bogor (578 km)" }, { key: "B", text: "Jakarta – Surabaya (650 km)" }, { key: "C", text: "Bandung – Yogyakarta (366 km)" }, { key: "D", text: "Bogor – Yogyakarta (460 km)" }], answerKey: "B" },
    { id: 31, stimulus: stim3, question: "Andi berada di Bogor dan ingin pergi ke Surabaya. Ada dua rute langsung/tak langsung:\n- Rute 1: Bogor -> Surabaya (langsung) = 578 km\n- Rute 2: Bogor -> Bandung -> Surabaya = 200 km + 400 km = 600 km\nSelisih jarak antara Rute 2 dan Rute 1 adalah...", options: [{ key: "A", text: "22 km" }, { key: "B", text: "32 km" }, { key: "C", text: "15 km" }, { key: "D", text: "50 km" }], answerKey: "A" },
    { id: 32, stimulus: stim3, question: "Budi berencana melakukan perjalanan dari Jakarta ke Yogyakarta. Manakah di antara jalur berikut yang memberikan rute terpendek (shortest path)?\n- Pilihan 1: Jakarta -> Bandung -> Yogyakarta\n- Pilihan 2: Jakarta -> Bogor -> Yogyakarta", options: [{ key: "A", text: "Pilihan 1 dengan jarak 516 km" }, { key: "B", text: "Pilihan 2 dengan jarak 540 km" }, { key: "C", text: "Pilihan 1 dengan jarak 550 km" }, { key: "D", text: "Pilihan 2 dengan jarak 516 km" }], answerKey: "A" },
    { id: 33, stimulus: stim3, question: "Berapakah derajat (degree / jumlah garis yang terhubung) dari simpul kota Bogor?", options: [{ key: "A", text: "2" }, { key: "B", text: "3" }, { key: "C", text: "4" }, { key: "D", text: "5" }], answerKey: "C" },
    { id: 34, stimulus: stim3, question: "Kota manakah dalam graph tersebut yang memiliki derajat (degree) terbesar / koneksi terbanyak?", options: [{ key: "A", text: "Jakarta" }, { key: "B", text: "Bandung dan Bogor" }, { key: "C", text: "Surabaya" }, { key: "D", text: "Yogyakarta" }], answerKey: "B" },
    { id: 35, stimulus: stim3, question: "Jika perjalanan dari Jakarta ke Surabaya dilakukan melalui rute: Jakarta -> Bogor -> Surabaya, berapa total jaraknya dan bagaimana perbandingannya dengan rute langsung Jakarta -> Surabaya (650 km)?", options: [{ key: "A", text: "Total 658 km, lebih jauh 8 km dari rute langsung." }, { key: "B", text: "Total 648 km, lebih pendek 2 km dari rute langsung." }, { key: "C", text: "Total 650 km, sama dengan rute langsung." }, { key: "D", text: "Total 578 km, lebih pendek 72 km." }], answerKey: "A" },
    { id: 36, stimulus: stim3, question: "Misalkan jalan antara Bandung dan Yogyakarta ditutup karena perbaikan. Rute alternatif terpendek dari Bandung ke Yogyakarta adalah melalui...", options: [{ key: "A", text: "Bandung -> Jakarta -> Bogor -> Yogyakarta" }, { key: "B", text: "Bandung -> Bogor -> Yogyakarta" }, { key: "C", text: "Bandung -> Surabaya -> Bogor -> Yogyakarta" }, { key: "D", text: "Tidak ada rute lain yang bisa dilalui" }], answerKey: "B" },
    { id: 37, stimulus: stim3, question: "Sebuah perusahaan logistik ingin mengirim barang dari Jakarta ke Yogyakarta. Pengemudi memilih rute Jakarta -> Bogor -> Yogyakarta (540 km) dengan alasan menghindari kemacetan di Bandung, meskipun rute Jakarta -> Bandung -> Yogyakarta (516 km) lebih pendek 24 km. Penilaian efisiensi keputusan ini adalah...", options: [{ key: "A", text: "Keputusan salah total karena jarak adalah satu-satunya indikator efisiensi." }, { key: "B", text: "Keputusan rasional jika bobot waktu/kemacetan dihitung sebagai faktor biaya selain bobot jarak fisik." }, { key: "C", text: "Keputusan tidak dapat dianalisis dengan grafik graph." }, { key: "D", text: "Keputusan harus selalu memilih angka terkecil tanpa memperhitungkan variabel lain." }], answerKey: "B" },
    { id: 38, stimulus: stim3, question: "Jika pemerintah ingin membangun tol baru untuk memangkas jarak langsung terbanyak antar simpul yang belum terhubung langsung, ruas jalan baru manakah yang paling kritis untuk dibangun?", options: [{ key: "A", text: "Jakarta – Yogyakarta" }, { key: "B", text: "Bandung – Jakarta" }, { key: "C", text: "Bogor – Jakarta" }, { key: "D", text: "Surabaya – Bandung" }], answerKey: "A" },
    { id: 39, stimulus: stim3, question: "Jika sebuah mobil menghabiskan 1 liter bensin untuk setiap 10 km, berapa liter bensin yang dibutuhkan untuk perjalanan rute terpendek dari Jakarta ke Surabaya?", options: [{ key: "A", text: "57,8 liter" }, { key: "B", text: "65 liter" }, { key: "C", text: "60 liter" }, { key: "D", text: "65,8 liter" }], answerKey: "B" },
    { id: 40, stimulus: stim3, question: "Menggunakan data bensin (1 liter / 10 km), berapakah biaya bensin untuk rute Bandung -> Bogor (200 km) jika harga bensin Rp10.000,- per liter?", options: [{ key: "A", text: "Rp150.000,-" }, { key: "B", text: "Rp200.000,-" }, { key: "C", text: "Rp250.000,-" }, { key: "D", text: "Rp300.000,-" }], answerKey: "B" },
    { id: 41, stimulus: stim3, question: "Dalam pengolahan data Google Sheets, jika data keterhubungan jarak antar 5 kota tersebut dimasukkan ke dalam bentuk tabel matriks 5x5, sel yang mempertemukan baris 'Jakarta' dan kolom 'Bogor' harus diisi angka...", options: [{ key: "A", text: "150" }, { key: "B", text: "650" }, { key: "C", text: "80" }, { key: "D", text: "0" }], answerKey: "C" },
    { id: 42, stimulus: stim3, question: "Jika kamu ingin menghitung rata-rata jarak jalur langsung dari kota Bandung ke seluruh kota lain yang terhubung padanya (Jakarta: 150, Yogyakarta: 366, Surabaya: 400, Bogor: 200), rumus yang dimasukkan ke Google Sheets adalah...", options: [{ key: "A", text: "=AVERAGE(150, 366, 400, 200)" }, { key: "B", text: "=COUNT(150, 366, 400, 200)" }, { key: "C", text: "=MAX(150, 366, 400, 200)" }, { key: "D", text: "=MIN(150, 366, 400, 200)" }], answerKey: "A" },
    { id: 43, stimulus: stim3, question: "Berapakah hasil rata-rata dari seluruh jarak langsung yang terhubung ke kota Bandung pada soal nomor 42?", options: [{ key: "A", text: "279 km" }, { key: "B", text: "280 km" }, { key: "C", text: "300 km" }, { key: "D", text: "316 km" }], answerKey: "A" },
    { id: 44, stimulus: stim3, question: "Struktur Data Graph pada peta jalan antarkota di atas tergolong ke dalam jenis...", options: [{ key: "A", text: "Graph Berarah dan Tidak Berbobot" }, { key: "B", text: "Graph Tidak Berarah (Undirected Graph) dan Berbobot (Weighted Graph)" }, { key: "C", text: "Graph Berarah (Directed Graph) dan Berbobot (Weighted Graph)" }, { key: "D", text: "Tree (Pohon)" }], answerKey: "B" },
    { id: 45, stimulus: stim3, question: "Jika ditambah satu simpul kota baru yaitu 'Semarang' yang terhubung ke Yogyakarta (120 km) dan Surabaya (300 km), manakah pernyataan yang BENAR?", options: [{ key: "A", text: "Jumlah simpul menjadi 6 dan total jalur/sisi bertambah 2." }, { key: "B", text: "Rute terpendek Jakarta ke Surabaya otomatis berubah melewati Semarang." }, { key: "C", text: "Derajat kota Bogor bertambah menjadi 5." }, { key: "D", text: "Fungsi =COUNT untuk menghitung jumlah kota akan menghasilkan nilai 5." }], answerKey: "A" }
  ];

  // Variabel State Ujian
  const JUMLAH_SOAL_UJIAN = 30; // Ambil 30 soal acak dari 45 bankSoal
  let soalTerpilih = [];
  let jawabanSiswa = [];
  let indexSekarang = 0;
  let dataSiswa = {};

  function acakArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function mulaiUjian() {
    const nama = document.getElementById("nama").value.trim();
    const kelas = document.getElementById("kelas").value;
    const mapel = document.getElementById("mapel").value;

    if (!nama || !kelas) {
      alert("Harap isi Nama Lengkap dan pilih Kelas terlebih dahulu!");
      return;
    }

    dataSiswa = { nama, kelas, mapel };

    // Acak 45 soal lalu ambil 30 soal
    const semuaSoalAcak = acakArray(bankSoal);
    soalTerpilih = semuaSoalAcak.slice(0, JUMLAH_SOAL_UJIAN);
    jawabanSiswa = new Array(soalTerpilih.length).fill(null);
    indexSekarang = 0;

    document.getElementById("info-siswa").innerText = `${nama} (${kelas})`;
    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("quiz-screen").classList.remove("hidden");

    tampilkanSoal();
  }

  function tampilkanSoal() {
    const soal = soalTerpilih[indexSekarang];
    const total = soalTerpilih.length;

    document.getElementById("progress-text").innerText = `Soal ${indexSekarang + 1} / ${total}`;

    // Tampilkan stimulus jika soal tersebut memilikinya
    const stimContainer = document.getElementById("stimulus-container");
    const stimText = document.getElementById("stimulus-text");
    if (soal.stimulus) {
      stimText.innerText = soal.stimulus;
      stimContainer.classList.remove("hidden");
    } else {
      stimContainer.classList.add("hidden");
    }

    document.getElementById("question-text").innerText = `${indexSekarang + 1}. ${soal.question}`;

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    soal.options.forEach((opt) => {
      const isSelected = jawabanSiswa[indexSekarang] === opt.key;
      const div = document.createElement("div");
      div.className = `option-item ${isSelected ? "selected" : ""}`;
      div.onclick = () => pilihJawaban(opt.key);

      div.innerHTML = `
        <input type="radio" name="opsi" ${isSelected ? "checked" : ""} />
        <span><strong>${opt.key}.</strong> ${opt.text}</span>
      `;
      optionsContainer.appendChild(div);
    });

    // Atur tombol navigasi
    document.getElementById("btn-prev").disabled = indexSekarang === 0;

    if (indexSekarang === total - 1) {
      document.getElementById("btn-next").classList.add("hidden");
      document.getElementById("btn-finish").classList.remove("hidden");
    } else {
      document.getElementById("btn-next").classList.remove("hidden");
      document.getElementById("btn-finish").classList.add("hidden");
    }
  }

  function pilihJawaban(keyOpsi) {
    jawabanSiswa[indexSekarang] = keyOpsi;
    tampilkanSoal();
  }

  function nextSoal() {
    if (indexSekarang < soalTerpilih.length - 1) {
      indexSekarang++;
      tampilkanSoal();
    }
  }

  function prevSoal() {
    if (indexSekarang > 0) {
      indexSekarang--;
      tampilkanSoal();
    }
  }

  function selesaiUjian() {
    const belumDijawab = jawabanSiswa.filter(j => j === null).length;
    if (belumDijawab > 0) {
      const yakin = confirm(`Masih ada ${belumDijawab} soal yang belum dijawab. Tetap kumpulkan ujian?`);
      if (!yakin) return;
    }

    let jumlahBenar = 0;
    let rincianArray = [];

    soalTerpilih.forEach((soal, i) => {
      const jwb = jawabanSiswa[i];
      const benar = jwb === soal.answerKey;
      if (benar) jumlahBenar++;
      const kodeJwb = jwb !== null ? jwb : "-";
      // Format rincian: NoUrut(IDAsli):Jawaban(B/S)
      rincianArray.push(`${i + 1}[#${soal.id}]:${kodeJwb}(${benar ? "B" : "S"})`);
    });

    const totalSoal = soalTerpilih.length;
    const nilaiSkala100 = Math.round((jumlahBenar / totalSoal) * 100);
    const rincianJawaban = rincianArray.join(", ");

    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    document.getElementById("final-score").innerText = nilaiSkala100;
    document.getElementById("detail-hasil").innerText = `Jumlah Benar: ${jumlahBenar} dari ${totalSoal} soal.`;

    const payload = {
      nama: dataSiswa.nama,
      kelas: dataSiswa.kelas,
      mapel: dataSiswa.mapel,
      jumlahBenar: jumlahBenar,
      nilai: nilaiSkala100,
      rincian: rincianJawaban
    };

    if (SCRIPT_URL && SCRIPT_URL !== "TEMPEL_URL_GOOGLE_APPS_SCRIPT_ANDA_DISINI") {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById("status-kirim").innerText = "✔ Nilai berhasil tersimpan ke Google Spreadsheet!";
        document.getElementById("status-kirim").style.color = "#16a34a";
      })
      .catch(() => {
        document.getElementById("status-kirim").innerText = "⚠ Gagal mengirim ke server. Silakan screenshot nilai ini.";
        document.getElementById("status-kirim").style.color = "#dc2626";
      });
    } else {
      document.getElementById("status-kirim").innerText = "Mode pratinjau (URL Apps Script belum diisi).";
    }
  }
</script>
